  var vc = document.getElementById('verCompare');
  if (vc) { if (!window._vcOrig) { window._vcOrig = vc.innerHTML; } if (v === 'CE') { vc.innerHTML = CE_COMPARE; } else if (v === 'ENVELOPE') { vc.innerHTML = ENVELOPE_COMPARE; } else if (v === 'QQE') { vc.innerHTML = QQE_COMPARE; } else { vc.innerHTML = window._vcOrig; } }
}
