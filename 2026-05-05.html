      tooltip: {trigger:'axis', axisPointer:{link:[{xAxisIndex:'all'}]}},
      grid: [{left:48, right:14, top:60, height:'54%'}, {left:48, right:14, top:'72%', height:'16%'}],
      xAxis: [{type:'category', data:STVX_TIMES, gridIndex:0, boundaryGap:false},
              {type:'category', data:STVX_TIMES, gridIndex:1, boundaryGap:false, axisLabel:{show:false}}],
      yAxis: [y0, {scale:true, gridIndex:1}],
      series: [
        {id:'stvx-mainfill', name:'主轨', type:'custom', silent:true, z:1, xAxisIndex:0, yAxisIndex:0, renderItem: function(params, api){ var v=api.value(0), v1=api.value(1), v2=api.value(2), v3=api.value(3), v4=api.value(4), v5=api.value(5), tr=api.value(6); if (v===v3) return null; var p1=api.coord([v,v1]), p2=api.coord([v3,v4]), p3=api.coord([v3,v5]), p4=api.coord([v,v2]); return {type:'polygon', shape:{points:[p1,p2,p3,p4]}, style:{fill: tr===1 ? 'rgba(8,153,129,0.12)' : 'rgba(242,54,69,0.12)', stroke:null}}; }, data: STVX_MAINFILL},
        {name:'3mK线', type:'line', xAxisIndex:0, yAxisIndex:0, symbol:'none', showSymbol:false, lineStyle:{color:'#374151', width:1}, z:2, data: STVX_CLOSE, markArea:{silent:true, data: STVX_MARKAREA}, markPoint:{data: STVX_SPINS}},
        {id:'stvx-upper', name:'影子主轨', type:'line', xAxisIndex:0, yAxisIndex:0, symbolSize:0, showSymbol:false, lineStyle:{color:'#9333ea', width:1.2, type:[6,4], opacity:0.9}, z:4, data: STVX_UPPER},
        {id:'stvx-lower', name:'影子主轨', type:'line', xAxisIndex:0, yAxisIndex:0, symbolSize:0, showSymbol:false, lineStyle:{color:'#9333ea', width:1.2, type:[6,4], opacity:0.9}, z:4, data: STVX_LOWER},
        {id:'stvx-mainup', name:'主轨', type:'line', xAxisIndex:0, yAxisIndex:0, symbolSize:0, showSymbol:false, lineStyle:{color:'#f23645', width:2}, z:5, data: STVX_MAINUP},
        {id:'stvx-maindn', name:'主轨', type:'line', xAxisIndex:0, yAxisIndex:0, symbolSize:0, showSymbol:false, lineStyle:{color:'#089981', width:2}, z:5, data: STVX_MAINDN},
        {id:'stvx-mainflips', name:'主轨', type:'scatter', xAxisIndex:0, yAxisIndex:0, symbol:'circle', symbolSize:10, z:6, label:{show:true, fontSize:12}, data: STVX_MAINFLIPS},
        {name:'每单盈亏', type:'scatter', xAxisIndex:0, yAxisIndex:0, symbolSize:1, itemStyle:{opacity:0}, label:{show:true, opacity:1, fontSize:11, fontWeight:'bold', position:'top', distance:1, formatter:function(p){return p.data.lbl;}}, data: STVX_SCAT},
        {name:'QQE', type:'line', xAxisIndex:1, yAxisIndex:1, symbol:'none', showSymbol:false, lineStyle:{color:'#2563eb', width:1}, data: valsData, markPoint:{data: STVX_PINS}}
      ]
    };
  }
  function paintBtns(on){
    if (svxBtn) {
      svxBtn.style.background = on ? '#2b7fff' : '#fff';
      svxBtn.style.color = on ? '#fff' : '#333';
      svxBtn.style.borderColor = on ? '#2b7fff' : '#ccc';
    }
    if (on) {
      var btns = document.querySelectorAll('button[data-ver]');
      for (var i=0;i<btns.length;i++) { if (btns[i] !== svxBtn) { btns[i].style.background = '#fff'; btns[i].style.color = '#333'; btns[i].style.borderColor = '#ccc'; } }
      var bq = document.getElementById('vt2023btnQ'), be = document.getElementById('vt2023btnE');
      if (bq) { bq.style.background = '#fff'; bq.style.color = '#333'; bq.style.borderColor = '#ccc'; }
      if (be) { be.style.background = '#fff'; be.style.color = '#333'; be.style.borderColor = '#ccc'; }
    }
  }
  function activate(){
    if (!active) {
      active = true;
      var kids = document.body.children;
      for (var i=0;i<kids.length;i++) {
        var el = kids[i];
        if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE') continue;
        if (el === wrap) continue;
        if (el.id === 'vt2023bar') continue;
        if (el.querySelector && el.querySelector('#daypick')) continue;
        el.__svxDisp = el.style.display;
        el.style.display = 'none';
      }
    }
    wrap.style.display = 'block';
    document.title = STVX_TITLE;
    paintBtns(true);
    try {
      if (!chart) { chart = echarts.init(document.getElementById('stvxCh')); chart.setOption(buildOption()); }
      else chart.resize();
    } catch(e) {}
  }
  function deactivate(){
    if (!active) return;
    active = false;
    wrap.style.display = 'none';
    var kids = document.body.children;
    for (var i=0;i<kids.length;i++) {
      var el = kids[i];
      if (el.__svxDisp !== undefined) { el.style.display = el.__svxDisp; delete el.__svxDisp; }
    }
    paintBtns(false);
  }
  var vtBar = document.getElementById('vt2023bar');
  if (vtBar) {
    var bq0 = document.getElementById('vt2023btnQ');
    svxBtn = document.createElement('button');
    svxBtn.type = 'button';
    svxBtn.id = 'stvxBtn';
    svxBtn.textContent = 'ST VX版';
    if (bq0) svxBtn.style.cssText = bq0.style.cssText;
    svxBtn.onclick = activate;
    vtBar.appendChild(svxBtn);
    ['vt2023btnQ','vt2023btnE'].forEach(function(id){
      var b = document.getElementById(id);
      if (b && b.onclick) { var ob = b.onclick; b.onclick = function(ev){ deactivate(); ob.call(this, ev); document.title = origTitle; }; }
    });
  } else {
    var sib = document.querySelector('button[data-ver]');
    if (sib) {
      svxBtn = document.createElement('button');
      svxBtn.type = 'button';
      svxBtn.textContent = 'ST VX版';
      svxBtn.dataset.ver = 'stvx';
      svxBtn.style.cssText = sib.style.cssText;
      sib.parentNode.appendChild(svxBtn);
      svxBtn.onclick = activate;
    }
    ['switchVersion3','switchVersion','switchVersion15'].forEach(function(name){
      var orig = window[name];
      if (typeof orig !== 'function' || orig.__svxWrapped) return;
      var w = function(v){ if (v === 'stvx') { activate(); return; } deactivate(); return orig.apply(this, arguments); };
      w.__svxWrapped = true;
      window[name] = w;
    });
  }
  window.addEventListener('resize', function(){ if (active && chart) { try { chart.resize(); } catch(e) {} } });
})();
</script>
