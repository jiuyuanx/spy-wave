function updateHeatmap(endIdx){
  endIdx = Math.max(0, Math.min(N-1, endIdx));
  var snap = SNAPS[HEATAT[endIdx]];
  var ma = [];
  // Find 7-zone: contiguous bins with heat >= 7
  var zonePrices = [];
  for (var k = 0; k < snap.heatmap.length; k++){
    var p = snap.heatmap[k][0];
    var v = snap.heatmap[k][1];
    v = Math.max(0, Math.min(15, v));
    var tc = (v >= 7) ? 'red' : 'black';
    ma.push([
      {yAxis: Math.round((p-0.25)*100)/100,
       itemStyle:{color: heatColor(v)},
       label:{show:true, position:'insideRight',fontWeight:'bold', formatter: v.toFixed(1),
              color: tc, fontSize:10, distance:4}},
      {yAxis: Math.round((p+0.25)*100)/100}
    ]);
    if (v >= 7) zonePrices.push(p);
  }
  // Calculate 7-zone edges and 15% disp lines
  var zoneUp = null, zoneLo = null, dispUp = null, dispLo = null;
  var klineData = OHLC;
  if (zonePrices.length > 0) {
    zoneLo = Math.min.apply(null, zonePrices) - 0.25;
    zoneUp = Math.max.apply(null, zonePrices) + 0.25;
    var zh = zoneUp - zoneLo;
    dispUp = zoneUp + 0.15 * zh;
    dispLo = zoneLo - 0.15 * zh;
    // White borders for K-lines overlapping the 7-zone
    klineData = OHLC.map(function(o){
      var lo = o[2], hi = o[1]; // [O,C,L,H] -> low=o[2], high=o[1]
      var overlap = !(hi < zoneLo || lo > zoneUp);
      if (overlap) {
        return {value: o, itemStyle:{borderColor:'#ffffff', borderWidth:2}};
      }
      return o;
    });
  }
  document.getElementById('curt').textContent = snap.time + '  (heat bins: ' + snap.heatmap.length + ')';
  // Build line data (horizontal lines across all times)
  function hline(val){
    if (val === null) return [];
    return TIMES.map(function(t){ return [t, val]; });
  }
  chart.setOption({
    series: [
      {id:'kline', data: klineData, markArea:{silent:true, data: ma}},
      {id:'zoneUp', data: hline(zoneUp)},
      {id:'zoneLo', data: hline(zoneLo)},
      {id:'dispUp', data: hline(dispUp)},
      {id:'dispLo', data: hline(dispLo)}
    ]
  });
}

    lastEnd = endIdx;
    updateHeatmap(endIdx);
  }
});
