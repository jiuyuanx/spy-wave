      svxBtn.style.background = on ? '#2b7fff' : '#fff';
      svxBtn.style.color = on ? '#fff' : '#333';
      svxBtn.style.borderColor = on ? '#2b7fff' : '#ccc';
    }
    if (on) {
      var btns = document.querySelectorAll('button[data-ver]');
      for (var i=0;i<btns.length;i++) { if (btns[i] !== svxBtn) { btns[i].style.background = '#fff'; btns[i].style.color = '#333'; btns[i].style.borderColor = '#ccc'; } }
      var bq = document.getElementById('vt2023btnQ'), be = document.getElementById('vt2023btnE');
      if (bq) { bq.style.background = '#fff'; bq.style.color = '#333'; bq.style.borderColor = '#ccc'; }
      if (be) { be.style.background = '#fff'; be.style.color = '#333'; be.style.borderColor = '#ccc'; }
    }
  }
  function activate(){
    if (!active) {
      active = true;
      var kids = document.body.children;
      for (var i=0;i<kids.length;i++) {
        var el = kids[i];
        if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE') continue;
        if (el === wrap) continue;
        if (el.id === 'vt2023bar') continue;
        if (el.querySelector && el.querySelector('#daypick')) continue;
        el.__svxDisp = el.style.display;
        el.style.display = 'none';
      }
    }
    wrap.style.display = 'block';
    document.title = STVX_TITLE;
    paintBtns(true);
    try {
      if (!chart) { chart = echarts.init(document.getElementById('stvxCh')); chart.setOption(buildOption()); }
      else chart.resize();
    } catch(e) {}
  }
  function deactivate(){
    if (!active) return;
    active = false;
    wrap.style.display = 'none';
    var kids = document.body.children;
    for (var i=0;i<kids.length;i++) {
      var el = kids[i];
      if (el.__svxDisp !== undefined) { el.style.display = el.__svxDisp; delete el.__svxDisp; }
    }
    paintBtns(false);
  }
  var vtBar = document.getElementById('vt2023bar');
  if (vtBar) {
    var bq0 = document.getElementById('vt2023btnQ');
    svxBtn = document.createElement('button');
    svxBtn.type = 'button';
    svxBtn.id = 'stvxBtn';
    svxBtn.textContent = 'ST VX版';
    if (bq0) svxBtn.style.cssText = bq0.style.cssText;
    svxBtn.onclick = activate;
    vtBar.appendChild(svxBtn);
    ['vt2023btnQ','vt2023btnE'].forEach(function(id){
      var b = document.getElementById(id);
      if (b && b.onclick) { var ob = b.onclick; b.onclick = function(ev){ deactivate(); ob.call(this, ev); document.title = origTitle; }; }
    });
  } else {
    var sib = document.querySelector('button[data-ver]');
    if (sib) {
      svxBtn = document.createElement('button');
      svxBtn.type = 'button';
      svxBtn.textContent = 'ST VX版';
      svxBtn.dataset.ver = 'stvx';
      svxBtn.style.cssText = sib.style.cssText;
      sib.parentNode.appendChild(svxBtn);
      svxBtn.onclick = activate;
    }
    ['switchVersion3','switchVersion','switchVersion15'].forEach(function(name){
      var orig = window[name];
      if (typeof orig !== 'function' || orig.__svxWrapped) return;
      var w = function(v){ if (v === 'stvx') { activate(); return; } deactivate(); return orig.apply(this, arguments); };
      w.__svxWrapped = true;
      window[name] = w;
    });
  }
  window.addEventListener('resize', function(){ if (active && chart) { try { chart.resize(); } catch(e) {} } });
})();
</script>
</body></html>
