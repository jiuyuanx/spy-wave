name: wave-dashboard

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟跑一次 (GitHub Actions 最小粒度)
  workflow_dispatch:          # 手动触发按钮

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install deps
        run: pip install -r requirements.txt

      - name: generate dashboard
        run: python gen_wave_today.py
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          WAVE_OUT_DIR: public
          WAVE_OUT_NAME: index.html
          WAVE_AUTOREFRESH: 180

      - name: save dated copy + archive
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          cp public/index.html public/$TODAY.html
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git show origin/gh-pages:archive.json > public/archive.json 2>/dev/null || echo '{"days":[]}' > public/archive.json
          python3 -c "
          import json
          p = 'public/archive.json'
          d = json.load(open(p))
          s = sorted(set(d.get('days', [])) | {'$TODAY'})
          json.dump({'days': s}, open(p, 'w'))
          "

      - name: deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true   # 保留历史日期文件, 只更新 index/当天/archive.json
