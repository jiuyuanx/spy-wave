name: wave-dashboard

on:
  schedule:
    - cron: '*/5 * * * 1-5'   # 每 5 分钟跑一次, 仅工作日 (周末不跑)
  workflow_dispatch:          # 手动触发按钮
    inputs:
      wave_date:
        description: '指定日期 (YYYY-MM-DD，空=今天)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install deps
        run: pip install -r requirements.txt

      - name: generate dashboard
        id: gen
        run: python gen_wave_today.py
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          WAVE_OUT_DIR: public
          WAVE_OUT_NAME: index.html
          WAVE_AUTOREFRESH: 60
          WAVE_DATE: ${{ inputs.wave_date }}

      - name: save dated copy + archive
        if: steps.gen.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=${{ inputs.wave_date }}
          if [ -z "$TODAY" ]; then TODAY=$(TZ=America/New_York date +%F); fi
          cp public/index.html public/$TODAY.html
          # archive.json via API (was: git fetch the whole gh-pages branch, ~85 s)
          curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/archive.json?ref=gh-pages" \
            > public/archive.json || echo '{"days":[]}' > public/archive.json
          python3 -c "
          import json
          p = 'public/archive.json'
          d = json.load(open(p))
          s = sorted(set(d.get('days', [])) | {'$TODAY'})
          json.dump({'days': s}, open(p, 'w'))
          "

      - name: guard publish dir
        if: steps.gen.outputs.skip != '1'
        run: |
          n=$(find public -type f | wc -l)
          echo "public files: $n"
          ls public
          if [ "$n" -gt 10 ]; then echo "REFUSE: public/ has $n files, expected only today files (index/TODAY/trades/archive). Day pages must never be deployed from main."; exit 1; fi

      - name: deploy to gh-pages
        if: steps.gen.outputs.skip != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Git Data API publish: only the files in public/ are uploaded on top of
        # the current gh-pages tree (keep_files semantics). Was peaceiris
        # actions-gh-pages cloning the whole branch every run (~135 s).
        run: python3 publish_gh_pages.py
