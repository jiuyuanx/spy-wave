    wrap.appendChild(b);
    window._verBtns.push(b);
  });
  sel.parentNode.insertBefore(wrap, sel.nextSibling);
  var dh = document.getElementById('dayhint');
  if (dh) dh.style.display = 'none';
  var cs = document.createElement('span');
  cs.id = 'verCompare';
  cs.innerHTML = "<span style=\"color:#000\">比QQE</span> <span style=\"color:#1a9e54\">+110.2%</span>";
  cs.style.fontSize = '13px';
  cs.style.marginLeft = '8px';
  cs.style.fontWeight = 'bold';
  sel.parentNode.insertBefore(cs, wrap.nextSibling);
  if (!sel.querySelector('option[value="summary.html"]')) { var so = document.createElement('option'); so.value = 'summary.html'; so.textContent = '📊 回测版本总览'; sel.insertBefore(so, sel.options[0]); }
})();
switchVersion('ST');
